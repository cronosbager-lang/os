name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.21'
  RUST_VERSION: '1.75'
  PYTHON_VERSION: '3.11'

jobs:
  build-binaries:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Build all binaries
        run: |
          mkdir -p release
          
          # mix-cli
          cd mix-cli
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../release/mix-cli-linux-amd64 .
          cd ..
          
          # mix-installer
          cd mix-installer
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../release/mix-installer-linux-amd64 .
          cd ..
          
          # mix-agent-early
          cd mix-agent-early
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../release/mix-agent-early-linux-amd64 .
          cd ..
          
          # mix-pkg
          cd mix-pkg
          cargo build --release
          cp target/release/mix-pkg ../release/mix-pkg-linux-amd64
          cd ..
      
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: release/

  build-iso:
    name: Build ISO
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorriso grub-pc-bin grub-efi-amd64-bin mtools \
            squashfs-tools dosfstools syslinux syslinux-utils
      
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: build/
      
      - name: Build ISO
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          VERSION=$VERSION bash iso/scripts/build-iso.sh
      
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: release-iso
          path: build/iso/*.iso

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-iso]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: release/
      
      - name: Download ISO
        uses: actions/download-artifact@v4
        with:
          name: release-iso
          path: release/
      
      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
