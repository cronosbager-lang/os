# MIXOS AI Early Boot Configuration
# /etc/mixos/ai-early.conf

# AI Model Configuration
[model]
# Path to the AI model file
path = /opt/mixos/ai/model/mix-early.gguf

# Context length (tokens)
context_length = 2048

# Number of threads for inference
threads = 4

# Temperature for generation (0.0 = deterministic, 1.0 = creative)
temperature = 0.3

# Maximum tokens to generate
max_tokens = 256

# AI Agent Configuration
[agent]
# Enable AI agent during boot
enabled = true

# Auto-start mode: always, on-error, manual
auto_start = on-error

# Timeout for AI responses (seconds)
timeout = 30

# Enable verbose logging
verbose = false

# Log file location
log_file = /var/log/mixos-ai-early.log

# Tool Configuration
[tools]
# Enable hardware detection tool
detect_hardware = true

# Enable module loading tool
load_module = true

# Enable root filesystem finder
find_root = true

# Enable command execution (use with caution)
execute_command = true

# Enable file reading
read_file = true

# Enable emergency shell
emergency_shell = true

# Safety Configuration
[safety]
# Require confirmation for dangerous operations
require_confirmation = true

# Forbidden commands (comma-separated)
forbidden_commands = rm -rf /,dd if=/dev/zero of=/dev/sd,mkfs

# Maximum command execution time (seconds)
max_execution_time = 60

# Enable sandboxing for command execution
sandboxing = true

# Prompts Configuration
[prompts]
# System prompt file
system_prompt = /opt/mixos/ai/prompts/boot-assistant.txt

# Hardware detection prompt
hardware_prompt = /opt/mixos/ai/prompts/hardware-detection.txt

# Troubleshooting prompt
troubleshooting_prompt = /opt/mixos/ai/prompts/troubleshooting.txt

# Boot Assistance Configuration
[boot]
# Enable automatic hardware detection
auto_detect_hardware = true

# Enable automatic module loading
auto_load_modules = true

# Enable automatic root filesystem detection
auto_find_root = true

# Timeout before falling back to manual boot (seconds)
auto_timeout = 10

# Enable boot troubleshooting on failure
troubleshoot_on_failure = true
