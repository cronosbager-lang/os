# MIXOS GO EFI GRUB Configuration
# UEFI boot configuration

set default=0
set timeout=5
set gfxmode=auto
set gfxpayload=keep

# Load modules
insmod all_video
insmod gfxterm
insmod png
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod search
insmod search_fs_uuid
insmod search_fs_file
insmod search_label

# Set terminal
terminal_output gfxterm

# Find the boot partition
search --no-floppy --set=root --label MIXOS_LIVE

# Theme
if [ -f /boot/grub/themes/mixos/theme.txt ]; then
    set theme=/boot/grub/themes/mixos/theme.txt
fi

# Menu entries
menuentry "MIXOS GO" --class mixos --class os {
    echo "Loading MIXOS GO..."
    linux /boot/vmlinuz-mixos root=live:LABEL=MIXOS_LIVE rd.live.image rw quiet splash
    initrd /boot/initramfs-mixos.img
}

menuentry "MIXOS GO (Safe Mode)" --class mixos --class os {
    echo "Loading MIXOS GO in safe mode..."
    linux /boot/vmlinuz-mixos root=live:LABEL=MIXOS_LIVE rd.live.image rw single
    initrd /boot/initramfs-mixos.img
}

menuentry "MIXOS GO (Debug)" --class mixos --class os {
    echo "Loading MIXOS GO with debug output..."
    linux /boot/vmlinuz-mixos root=live:LABEL=MIXOS_LIVE rd.live.image rw debug earlyprintk=serial,ttyS0,115200
    initrd /boot/initramfs-mixos.img
}

menuentry "MIXOS GO Installer" --class mixos --class os {
    echo "Starting MIXOS GO Installer..."
    linux /boot/vmlinuz-mixos root=live:LABEL=MIXOS_LIVE rd.live.image mixos.installer=1 rw quiet
    initrd /boot/initramfs-mixos.img
}

menuentry "MIXOS GO (Load to RAM)" --class mixos --class os {
    echo "Loading MIXOS GO to RAM..."
    linux /boot/vmlinuz-mixos root=live:LABEL=MIXOS_LIVE rd.live.image rd.live.ram=1 rw quiet splash
    initrd /boot/initramfs-mixos.img
}

menuentry "UEFI Firmware Settings" --class settings {
    fwsetup
}

menuentry "Reboot" --class reboot {
    reboot
}

menuentry "Shutdown" --class shutdown {
    halt
}
