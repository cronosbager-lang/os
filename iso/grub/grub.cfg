# MIXOS GO GRUB Configuration

set default=0
set timeout=5
set gfxmode=auto
set gfxpayload=keep

# Load modules
insmod all_video
insmod gfxterm
insmod png

# Set terminal
terminal_output gfxterm

# Theme (if available)
if [ -f /boot/grub/themes/mixos/theme.txt ]; then
    set theme=/boot/grub/themes/mixos/theme.txt
fi

# Menu entries
menuentry "MIXOS GO" --class mixos --class os {
    echo "Loading MIXOS GO..."
    linux /boot/vmlinuz-mixos root=LABEL=MIXOS_ROOT rw quiet splash
    initrd /boot/initramfs-mixos.img
}

menuentry "MIXOS GO (Safe Mode)" --class mixos --class os {
    echo "Loading MIXOS GO in safe mode..."
    linux /boot/vmlinuz-mixos root=LABEL=MIXOS_ROOT rw single
    initrd /boot/initramfs-mixos.img
}

menuentry "MIXOS GO (Debug)" --class mixos --class os {
    echo "Loading MIXOS GO with debug output..."
    linux /boot/vmlinuz-mixos root=LABEL=MIXOS_ROOT rw debug earlyprintk=serial,ttyS0,115200
    initrd /boot/initramfs-mixos.img
}

menuentry "MIXOS GO Live (RAM)" --class mixos --class os {
    echo "Loading MIXOS GO Live..."
    linux /boot/vmlinuz-mixos root=live:LABEL=MIXOS_LIVE rd.live.image rd.live.overlay.overlayfs=1 rw quiet splash
    initrd /boot/initramfs-mixos.img
}

menuentry "MIXOS GO Installer" --class mixos --class os {
    echo "Starting MIXOS GO Installer..."
    linux /boot/vmlinuz-mixos root=live:LABEL=MIXOS_LIVE rd.live.image mixos.installer=1 rw quiet
    initrd /boot/initramfs-mixos.img
}

menuentry "Memory Test (memtest86+)" --class memtest {
    linux16 /boot/memtest86+.bin
}

menuentry "Reboot" --class reboot {
    reboot
}

menuentry "Shutdown" --class shutdown {
    halt
}
