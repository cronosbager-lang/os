# MIXOS GO ISOLINUX Configuration
# Legacy BIOS boot configuration

DEFAULT mixos
TIMEOUT 50
PROMPT 1

UI vesamenu.c32
MENU TITLE MIXOS GO Boot Menu
MENU BACKGROUND splash.png
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #9033ccff #a0000000 std
MENU COLOR sel          7;37;40 #e0ffffff #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std
MENU COLOR timeout_msg  37;40   #80ffffff #00000000 std
MENU COLOR timeout      1;37;40 #c0ffffff #00000000 std
MENU COLOR msg07        37;40   #90ffffff #a0000000 std
MENU COLOR tabmsg       31;40   #30ffffff #00000000 std

LABEL mixos
    MENU LABEL ^MIXOS GO
    MENU DEFAULT
    KERNEL /boot/vmlinuz-mixos
    APPEND initrd=/boot/initramfs-mixos.img root=live:LABEL=MIXOS_LIVE rd.live.image quiet splash
    TEXT HELP
    Boot MIXOS GO operating system
    ENDTEXT

LABEL mixos-safe
    MENU LABEL MIXOS GO (^Safe Mode)
    KERNEL /boot/vmlinuz-mixos
    APPEND initrd=/boot/initramfs-mixos.img root=live:LABEL=MIXOS_LIVE rd.live.image single
    TEXT HELP
    Boot MIXOS GO in safe mode (single user)
    ENDTEXT

LABEL mixos-debug
    MENU LABEL MIXOS GO (^Debug)
    KERNEL /boot/vmlinuz-mixos
    APPEND initrd=/boot/initramfs-mixos.img root=live:LABEL=MIXOS_LIVE rd.live.image debug earlyprintk=serial,ttyS0,115200
    TEXT HELP
    Boot MIXOS GO with debug output
    ENDTEXT

LABEL mixos-installer
    MENU LABEL MIXOS GO ^Installer
    KERNEL /boot/vmlinuz-mixos
    APPEND initrd=/boot/initramfs-mixos.img root=live:LABEL=MIXOS_LIVE rd.live.image mixos.installer=1 quiet
    TEXT HELP
    Start MIXOS GO installation wizard
    ENDTEXT

LABEL mixos-toram
    MENU LABEL MIXOS GO (Load to ^RAM)
    KERNEL /boot/vmlinuz-mixos
    APPEND initrd=/boot/initramfs-mixos.img root=live:LABEL=MIXOS_LIVE rd.live.image rd.live.ram=1 quiet splash
    TEXT HELP
    Load entire system to RAM (requires 4GB+ RAM)
    ENDTEXT

LABEL memtest
    MENU LABEL ^Memory Test (memtest86+)
    KERNEL /boot/memtest86+.bin
    TEXT HELP
    Run memory diagnostic test
    ENDTEXT

LABEL hdt
    MENU LABEL ^Hardware Detection Tool
    COM32 hdt.c32
    TEXT HELP
    Display hardware information
    ENDTEXT

LABEL reboot
    MENU LABEL ^Reboot
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL ^Power Off
    COM32 poweroff.c32
