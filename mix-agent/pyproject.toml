[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mixos-agent"
version = "1.0.0"
description = "MIXOS AI Agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "MIXOS Team"}
]
dependencies = [
    "llama-cpp-python>=0.2.56",
    "tiktoken>=0.5.2",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.5.0",
    "psutil>=5.9.8",
    "docker>=7.0.0",
    "pyyaml>=6.0.1",
    "toml>=0.10.2",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "loguru>=0.7.2",
]

[project.scripts]
mixos-agent = "mixos_agent.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=24.1.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mixos_agent*"]
