[package]
name = "mix-pkg"
version = "1.0.0"
edition = "2021"
authors = ["MIXOS Team"]
description = "MIXOS Package Manager"
license = "MIT"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
reqwest = { version = "0.11", features = ["blocking", "json"] }
sha2 = "0.10"
tar = "0.4"
zstd = "0.13"
anyhow = "1.0"
thiserror = "1.0"
colored = "2.1"
indicatif = "0.17"
dirs = "5.0"
walkdir = "2.4"
flate2 = "1.0"
xz2 = "0.1"
md5 = "0.7"

[profile.release]
lto = true
strip = true
opt-level = "z"
