[package]
name = "mix-pkg"
version = "1.0.0"
edition = "2021"
authors = ["MIXOS Team"]
description = "MIXOS Package Manager"
license = "MIT"

[dependencies]
clap = { version = "3.2", features = ["derive"] }
tokio = { version = "1.0", features = ["rt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.5"
sha2 = "0.10"
tar = "0.4"
anyhow = "1.0"
thiserror = "1.0"
colored = "2.0"
dirs = "4.0"
walkdir = "2.3"
flate2 = "1.0"
xz2 = "0.1"
md5 = "0.7"
indicatif = "0.15"
zstd = "0.12"

[profile.release]
lto = true
strip = true
opt-level = "z"
