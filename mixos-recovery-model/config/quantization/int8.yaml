# MRM Quantization Configuration - INT8
# MixOS Recovery Model v2 - Field Resonance Architecture

quantization:
  method: "ggml"
  bits: 8
  group_size: 128
  damp_percent: 0.05
  
  calibration:
    dataset: "data/processed/valid.jsonl"
    num_samples: 128
    seq_length: 512
    
  output:
    format: "gguf"
    path: "outputs/mrm-field-int8.gguf"
