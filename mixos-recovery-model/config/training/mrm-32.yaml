# MRM-32 Training Configuration
# MixOS Recovery Model v2 - Field Resonance Architecture
# Minimal configuration with 32 variants (ultra-lightweight)

being:
  field_dim: 64
  attractor_capacity: 16
  resonance_freq: 1.0

variants:
  count: 32
  domains: 8
  iterations_per_domain: 4
  embed_dim: 32

coupling:
  topology: "sparse"
  intra_domain: 0.8
  inter_domain: 0.3
  being_variant: 0.5

field:
  resolution: 16
  diffusion: 0.1
  damping: 0.05

settling:
  max_steps: 30
  convergence_threshold: 1.0e-3
  dt: 0.1
