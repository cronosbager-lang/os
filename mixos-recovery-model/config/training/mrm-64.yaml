# MRM-64 Training Configuration
# MixOS Recovery Model v2 - Field Resonance Architecture
# Primary configuration with 64 variants

being:
  field_dim: 128
  attractor_capacity: 32
  resonance_freq: 1.0

variants:
  count: 64
  domains: 8
  iterations_per_domain: 8
  embed_dim: 64

coupling:
  topology: "sparse"
  intra_domain: 0.8
  inter_domain: 0.3
  being_variant: 0.5

field:
  resolution: 32
  diffusion: 0.1
  damping: 0.05

settling:
  max_steps: 50
  convergence_threshold: 1.0e-4
  dt: 0.1
