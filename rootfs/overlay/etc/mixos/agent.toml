# MIXOS AI Agent Configuration

[agent]
name = "Mix Agent"
version = "1.0.0"
enabled = true
auto_start = true

[model]
path = "/opt/mixos/ai/model/mix-small-1.1b-q4.gguf"
context_length = 4096
temperature = 0.7
top_p = 0.95
top_k = 40
repeat_penalty = 1.1

[inference]
threads = 4
batch_size = 512
gpu_layers = 0

[memory]
max_conversation_history = 50
enable_long_term_memory = true
memory_db_path = "/var/lib/mixos/agent/memory.db"

[safety]
require_confirmation = ["install_package", "remove_package", "system_update"]
forbidden_commands = ["rm -rf /", "dd if=/dev/zero of=/dev/sd"]
max_execution_time = 300
enable_sandboxing = true

[tools]
enabled_tools = ["all"]
custom_tools_path = "/opt/mixos/agent/tools/"

[api]
host = "127.0.0.1"
port = 8765
enable_cors = true

[logging]
level = "info"
path = "/var/log/mixos/agent.log"
max_size = "100MB"
rotation = "daily"
